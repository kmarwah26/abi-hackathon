# Databricks App configuration for the ABI Genie + Lakebase assistant.
#
# The `command` launches Streamlit. Databricks Apps injects the port the app
# must listen on; Streamlit reads it from the STREAMLIT_SERVER_PORT env var,
# which the platform sets for you, so no explicit --server.port is needed.
command:
  - "streamlit"
  - "run"
  - "app.py"

env:
  # ----------------------------------------------------------------------
  # Genie space id — copy it from the Genie space URL:
  #   /genie/rooms/<THIS-IS-THE-SPACE-ID>
  # (see notebook 2). Replace the placeholder below before deploying.
  # ----------------------------------------------------------------------
  - name: GENIE_SPACE_ID
    value: "01f1a48a4a35108ebbe9c940cdc11a8a"

  # ----------------------------------------------------------------------
  # Agent Bricks Knowledge Assistant serving-endpoint name (from Notebook 3).
  # Answers policy / how-to questions from the knowledge_base Volume docs.
  # Leave blank to disable the "Ask the docs" tab.
  # ----------------------------------------------------------------------
  - name: KA_ENDPOINT
    value: ""

  # ----------------------------------------------------------------------
  # Demand-forecast Model Serving endpoint (plain-sklearn copy of the Notebook 4
  # model). The Forecast tab sends typed features here for live inference.
  # PER-USER: set this to the endpoint Notebook 4 (Step 6) printed for you —
  # `abi-demand-forecast-<your-username>`. FORECAST_BASE_YEAR must match the
  # model's training base year (min order year), also printed by Notebook 4.
  # ----------------------------------------------------------------------
  - name: FORECAST_ENDPOINT
    value: "abi-demand-forecast"          # e.g. abi-demand-forecast-jsmith
  - name: FORECAST_BASE_YEAR
    value: "2023"

  # ----------------------------------------------------------------------
  # Lakebase connection. The app derives host + Postgres user from the instance
  # via the SDK (see app.py get_engine), so we DON'T map the fiddly PG* vars
  # here — we just tell it which instance and logical database to use. Attaching
  # the Database resource (below) is what gives the app's service principal a
  # Lakebase role + network access; app.py mints its own OAuth token.
  # ----------------------------------------------------------------------
  # Logical database inside Lakebase that holds our app tables (Notebook 5).
  # PER-USER: set to the DB Notebook 5/7 printed for you — `abi_app_<your-username>`.
  - name: PGAPPDB
    value: "abi_app"                      # e.g. abi_app_jsmith
  # Instance name — SHARED across users; used to look up the host + mint the token.
  - name: LAKEBASE_INSTANCE
    value: "abi-hackathon-lakebase"

# --------------------------------------------------------------------------
# On-behalf-of-user (OBO) authorization.
#
# With this block present, Databricks forwards the signed-in user's OAuth token
# to the app in the `x-forwarded-access-token` header. app.py uses it to call
# **Genie** and the **Knowledge Assistant** AS THAT USER, so Unity Catalog
# enforces each user's own permissions (per-user governance) instead of the
# app service principal's. Lakebase app-state (conversations log, action items,
# forecast) still uses the service principal — it's shared app state, not
# per-user governed data (see app.py get_user_client / get_workspace_client).
#
# Prerequisites (otherwise the OBO calls fail, correctly, with "permission
# denied" rather than silently showing SP-level data):
#   * A workspace/account admin must ENABLE user authorization for apps and
#     allow these scopes (allowedAppsUserApiScopes).
#   * Each end user needs CAN_RUN on the Genie space, CAN_QUERY on the KA
#     serving endpoint, and UC SELECT on the underlying curated tables.
# If a scope turns out to be too narrow at runtime, the catch-all `all-apis`
# works but grants the app broad power on the user's behalf — prefer the
# least-privilege list below.
# --------------------------------------------------------------------------
user_authorization:
  scopes:
    - genie                       # call the Genie Conversation API as the user
    - sql                         # run Genie's generated SQL / fetch results as the user
    - serving.serving-endpoints   # query the Knowledge Assistant as the user
    - iam.current-user:read       # resolve the user's identity

# --------------------------------------------------------------------------
# Resources (attached at create time via `apps create --json`, or in the app
# editor: Compute > Apps > your app > Edit > Resources):
#   * Database         -> your Lakebase instance, key "lakebase",
#                         CAN_CONNECT_AND_CREATE (Lakebase role + network access)
#   * Genie space      -> permission CAN_RUN (lets the SP call the Conversation API)
#   * Serving endpoint -> your Knowledge Assistant endpoint, CAN_QUERY
#                         (lets the SP call the assistant for the "Ask the docs" tab)
# The app SP also needs SELECT on the curated UC tables and INSERT on
# app.conversations, plus SELECT on app.demand_forecast (granted in Notebook 7,
# Step 5).
# --------------------------------------------------------------------------
